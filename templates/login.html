<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 小星考公日记</title>

    <!-- 关键CSS内联，加快首次渲染 -->
    <style>
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#EFE8DB 0%,#F5EFE4 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0}
        .auth-card{background:#fff;border-radius:16px;padding:32px 28px;box-shadow:0 4px 20px rgba(0,0,0,0.08);max-width:380px;width:90%;margin:auto}
        .auth-card h1{text-align:center;font-size:22px;font-weight:600;margin-bottom:8px;color:#1E293B}
        .auth-subtitle{text-align:center;color:#64748B;margin-bottom:24px;font-size:13px}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;margin-bottom:6px;font-weight:500;font-size:13px;color:#1E293B}
        .form-group input{width:100%;padding:10px 12px;border:1px solid #E2E8F0;border-radius:8px;font-size:14px;box-sizing:border-box}
        .form-group input:focus{outline:none;border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
        .btn-primary{width:100%;padding:12px 20px;background:#2563EB;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:background 0.2s}
        .btn-primary:hover{background:#1D4ED8}
        .btn-primary:disabled{opacity:0.6;cursor:not-allowed}
        .message{margin-top:16px;padding:10px 14px;border-radius:8px;text-align:center;font-size:14px}
        .message.success{background:rgba(16,185,129,0.1);color:#10B981}
        .message.error{background:rgba(239,68,68,0.1);color:#EF4444}
        .auth-footer{text-align:center;margin-top:16px;color:#64748B;font-size:13px}
        .auth-footer a{color:#2563EB;text-decoration:none}
        .loading{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle}
        @keyframes spin{to{transform:rotate(360deg)}}
        /* 密码显示切换 */
        .password-toggle{position:relative}
        .password-toggle input{padding-right:40px}
        .password-toggle-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:#94A3B8;padding:4px}
    </style>

    <!-- 完整样式阻塞加载，避免首屏文字先于样式出现 -->
    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        .auth-tips {
            margin-top: 16px;
            padding: 12px;
            background: rgba(37, 99, 235, 0.08);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-light);
            border-left: 3px solid var(--primary);
        }
        .auth-tips-title {
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--primary);
        }
        .auth-tips-list {
            margin: 0;
            padding-left: 18px;
        }
        .auth-tips-list li {
            margin-bottom: 4px;
            line-height: 1.5;
        }
        .password-toggle {
            position: relative;
        }
        .password-toggle input {
            padding-right: 40px;
        }
        .password-toggle-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: var(--text-muted);
            padding: 4px;
        }
        .password-toggle-btn:hover {
            color: var(--text);
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <h1>📔 小星考公日记</h1>
            <p class="auth-subtitle">用四圣谏言记录每一天</p>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="password-toggle">
                        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="请输入密码（至少6位）">
                        <button type="button" class="password-toggle-btn" id="togglePassword" title="显示/隐藏密码">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="loginBtn">登录</button>
            </form>

            <div class="auth-footer">
                <p>还没有账号？<a href="/register">立即注册</a></p>
            </div>

            <div class="auth-tips">
                <div class="auth-tips-title">💡 首次使用？</div>
                <ul class="auth-tips-list">
                    <li>如果是第一次使用，请先点击上方"立即注册"创建账号</li>
                    <li>注册时用户名至少3个字符，密码至少6个字符</li>
                    <li>忘记密码？请联系管理员重置</li>
                </ul>
            </div>

            <div id="message" class="message" style="display: none;"></div>
        </div>
    </div>

    <script>
        // 密码显示/隐藏切换
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                this.textContent = '🙈';
                this.title = '隐藏密码';
            } else {
                passwordInput.type = 'password';
                this.textContent = '👁️';
                this.title = '显示密码';
            }
        });

        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            const loginBtn = document.getElementById('loginBtn');

            // 基础验证
            if (username.length < 3) {
                showMessage('用户名至少需要3个字符', 'error');
                return;
            }
            if (password.length < 6) {
                showMessage('密码至少需要6个字符', 'error');
                return;
            }

            // 禁用按钮，显示加载状态
            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok) {
                    showMessage('登录成功！正在跳转...', 'success');
                    setTimeout(() => window.location.href = '/', 800);
                } else {
                    // 根据错误类型提供更具体的提示
                    let errorMsg = data.error || '登录失败';
                    if (errorMsg.includes('用户名或密码错误')) {
                        errorMsg = '用户名或密码错误，请检查后重试';
                        errorMsg += '\n\n💡 提示：如果是首次使用，请先注册账号';
                    }
                    showMessage(errorMsg, 'error');
                }
            } catch (err) {
                console.error('登录错误:', err);
                showMessage('网络连接失败，请检查网络后重试', 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        });

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';

            // 3秒后自动隐藏成功消息
            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 3000);
            }
        }

        // 自动聚焦用户名输入框
        document.getElementById('username').focus();

        // 支持Enter键切换焦点
        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('password').focus();
            }
        });
    </script>
</body>
</html>
