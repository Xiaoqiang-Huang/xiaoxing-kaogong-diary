<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 日记系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <h1>📔 日记系统</h1>
            <p class="auth-subtitle">创建你的日记账号</p>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" name="username" required minlength="3" autocomplete="username">
                    <small>至少3个字符</small>
                </div>
                <div class="form-group">
                    <label>显示称呼</label>
                    <input type="text" id="displayName" name="displayName" autocomplete="nickname" placeholder="AI 会用这个名字称呼你">
                    <small>不填则使用用户名</small>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
                    <small>至少6个字符</small>
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>邀请码（公网访问时可能需要）</label>
                    <input type="text" id="inviteCode" autocomplete="off" placeholder="没有邀请码可留空">
                </div>
                <button type="submit" class="btn-primary">注册</button>
            </form>

            <div class="auth-footer">
                <p>已有账号？<a href="/login">立即登录</a></p>
            </div>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const displayName = document.getElementById('displayName').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const inviteCode = document.getElementById('inviteCode').value.trim();
            const messageDiv = document.getElementById('message');

            if (password !== confirmPassword) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '两次密码不一致';
                return;
            }

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, display_name: displayName, password, invite_code: inviteCode })
                });

                const data = await res.json();

                if (res.ok) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = '注册成功，跳转中...';
                    setTimeout(() => window.location.href = '/', 500);
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = data.error || '注册失败';
                }
            } catch (err) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '网络错误，请重试';
            }
        });
    </script>
</body>
</html>
